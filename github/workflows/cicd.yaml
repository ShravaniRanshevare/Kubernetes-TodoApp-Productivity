name: TodoApp CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ first_secret_git.DOCKERHUB_USERNAME }}
          password: ${{ first_secret_git.DOCKERHUB_TOKEN }}

      # --- Backend ---
      - name: Build backend image
        run: |
          docker build \
            -t ${{ first_secret_git.DOCKERHUB_USERNAME }}/todoapp-backend:${{ github.sha }} \
            ./TodoAppNew

      # --- Frontend ---
      - name: Build frontend image
        run: |
          docker build \
            -t ${{ first_secret_git.DOCKERHUB_USERNAME }}/todoapp-frontend:${{ github.sha }} \
            ./frontend

      # --- Push images ---
      - name: Push backend image
        run: docker push ${{ first_secret_git.DOCKERHUB_USERNAME }}/todoapp-backend:${{ github.sha }}

      - name: Push frontend image
        run: docker push ${{ first_secret_git.DOCKERHUB_USERNAME }}/todoapp-frontend:${{ github.sha }}
