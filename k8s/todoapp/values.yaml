backend:
  image:
    repository: shravrocks/todo-backend
    tag: "v4"
  replicas: 1
  port: 8000
  servicePort: 8000 
  resources:
    limits:
      cpu: "300m"
      memory: "256Mi"
    requests:
      cpu: "100m"
      memory: "128Mi" 
  probes:
    liveness:
      path: "/health"
      port: 8000
    readiness:
      path: "/health"
      port: 8000
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    cpuUtilization: 70


frontend:
  image:
    repository: shravrocks/todo-frontend
    tag: "latest"
  replicas: 1
  port: 5173
  servicePort: 5173
  probes:
    liveness:
      path: "/"
      port: 5173
    readiness:
      path: "/"
      port: 5173

ingress:
  host: "todoapp.local"
  frontendPort: 5173

  
  
