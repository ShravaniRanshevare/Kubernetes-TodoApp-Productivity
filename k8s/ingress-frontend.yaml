apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-ingress
  namespace: todoapp
  annotations:
    cert-manager.io/cluster-issuer: selfsigned-issuer.yaml 
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - todoapp.local
      secretName: todoapp-tls
  rules:
    - host: todoapp.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-svc
                port:
                  number: 5173